name: A workflow for my Hello World App

on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup network and MongoDB
        run: |
          docker network create --driver bridge se-methods
          docker pull mongo:latest
          docker run -d --name mongo-dbserver --network se-methods mongo:latest

      - name: Build with Maven
        run: mvn package

      - name: Build Docker Image
        run: docker build -t semethods:latest .

      - name: Run Docker Image
        run: docker run --network se-methods --name devopscontainer semethods:latest

      - name: View Container Logs
        run: docker logs devopscontainer